base_images:
  tools:
    name: "4.22"
    namespace: ocp
    tag: tools
binary_build_commands: make build WHAT=cmd/openshift-tests
build_root:
  from_repository: true
images:
- dockerfile_path: images/tests/Dockerfile.rhel
  from: tools
  to: tests
releases:
  initial:
    integration:
      name: "4.22"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.22"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 6Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-gcp-nvidia-dra
  optional: true
  run_if_changed: ^test/extended/(node/dra/nvidia|dra/nvidia)/.*
  steps:
    cluster_profile: gcp
    env:
      COMPUTE_NODE_REPLICAS: "1"
      COMPUTE_NODE_TYPE: n1-standard-4
      COMPUTE_ON_HOST_MAINTENANCE: Terminate
      COMPUTE_ZONES: '[us-central1-a]'
    post:
    - ref: nvidia-cleanup
    - chain: ipi-gcp-post
    pre:
    - chain: ipi-conf-gcp
    - ref: ipi-conf-gcp-confidential-computing
    - chain: ipi-install
    - ref: nvidia-nfd-operator-install
    - ref: nvidia-gpu-operator-install
    test:
    - as: nvidia-dra-tests
      commands: |
        #!/bin/bash
        set -o nounset
        set -o errexit
        set -o pipefail

        export KUBECONFIG="${SHARED_DIR}/kubeconfig"

        echo "Waiting for cluster to be ready..."
        oc wait --for=condition=Ready nodes --all --timeout=10m

        echo "Checking for GPU nodes..."
        GPU_NODES=$(oc get nodes -l nvidia.com/gpu.present=true -o name 2>/dev/null | wc -l)
        echo "Found ${GPU_NODES} GPU node(s)"

        if [ "${GPU_NODES}" -eq 0 ]; then
          echo "WARNING: No GPU nodes found. Tests will skip automatically."
          oc get nodes --show-labels
        fi

        mkdir -p "${ARTIFACT_DIR}/nvidia-dra"

        echo "Running NVIDIA DRA tests with [Feature:NVIDIA-DRA] tag..."
        openshift-tests run openshift/conformance/parallel --dry-run --provider=none | \
          grep -E "\[Feature:NVIDIA-DRA\]" | \
          openshift-tests run -o "${ARTIFACT_DIR}/nvidia-dra/test-output.log" \
            --junit-dir="${ARTIFACT_DIR}/nvidia-dra/junit" -f -
      from: tests
      resources:
        requests:
          cpu: 1000m
          memory: 2Gi
zz_generated_metadata:
  branch: main
  org: openshift
  repo: origin
  variant: nvidia-dra
